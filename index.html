    // ========================================================================

    // Khi chạy trên Canvas Preview, hệ thống tự động cung cấp __firebase_config.
    // Nếu bạn tải file index.html về máy cá nhân để chạy riêng qua Internet,
    // hãy dán cấu hình Firebase Web App của bạn vào phần fallback bên dưới.
    let firebaseConfig = {
      apiKey: "AIzaSyAdc33anEGur9sEtCZcg8CECYGEDh_hdgs",
      authDomain: "classroom-live-game.firebaseapp.com",
      projectId: "classroom-live-game",
    };
    let hasFirebaseConfig = true;

    try {
      if (typeof __firebase_config !== "undefined" && __firebase_config) {
        firebaseConfig = JSON.parse(__firebase_config);
        hasFirebaseConfig = Boolean(firebaseConfig && firebaseConfig.apiKey && firebaseConfig.projectId);
      }
    } catch (err) {
      console.warn("Firebase config parse warning:", err);
    }

    const appId = typeof __app_id !== "undefined" && __app_id ? __app_id : "dau-truong-tri-thuc-v1";

    let app = null;
    let auth = null;
    let db = null;

    if (hasFirebaseConfig) {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
      } catch (err) {
        console.error("Firebase init failed:", err);

      }

    // RULE 1: Strict Firestore paths under /artifacts/{appId}/public/data/{col}
    const publicCol = (colName) => collection(db, "artifacts", appId, "public", "data", colName);
    const publicDoc = (colName, docId) => doc(db, "artifacts", appId, "public", "data", colName, docId);

    // ========================================================================
    // 2. SOUND ENGINE (WEB AUDIO API - NO EXTERNAL URLS)
    // ========================================================================
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx && typeof window !== "undefined") {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume().catch(() => {});
        }
      }
      playTone(freq, type = "sine", duration = 0.14, volume = 0.14, delay = 0) {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(volume, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + duration);
        } catch {}
      }
      click() { this.playTone(620, "triangle", 0.06, 0.1); }
      tick() { this.playTone(880, "sine", 0.05, 0.08); }
      correct() {
        this.playTone(523.25, "sine", 0.12, 0.16, 0);
        this.playTone(659.25, "sine", 0.12, 0.16, 0.1);
        this.playTone(783.99, "sine", 0.22, 0.18, 0.2);
      }
      wrong() {
        this.playTone(280, "sawtooth", 0.16, 0.11, 0);
        this.playTone(210, "sawtooth", 0.24, 0.11, 0.14);
      }
      startQuestion() {
        this.playTone(440, "triangle", 0.1, 0.14, 0);
        this.playTone(587.33, "triangle", 0.18, 0.15, 0.1);
      }
      victory() {
        const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
        const times = [0, 0.12, 0.24, 0.36, 0.52, 0.65];
        notes.forEach((n, i) => this.playTone(n, "triangle", 0.24, 0.16, times[i]));
      }
    }
    const sfx = new SoundManager();

    // ========================================================================
    // 4. SVG CHARACTERS (STUDENTS AT DESKS & TEACHER IN AO DAI)
    // ========================================================================
    function renderStudentAvatarSVG(avatarId, status = "idle", size = "md") {
      const av = AVATARS.find((a) => a.id === avatarId) || AVATARS[0];
      const dim = size === "sm" ? "w-14 h-16" : "w-20 h-24";
      const bounceClass = status === "correct" ? "animate-bounce" : "";

      let hairBack = "";
      if (av.gender === "girl") {
        hairBack += `<ellipse cx="50" cy="40" rx="24" ry="22" fill="${av.hair}" />`;
        if (av.accessory === "pigtails") {
          hairBack += `
            <circle cx="24" cy="42" r="9" fill="${av.hair}" />
            <circle cx="76" cy="42" r="9" fill="${av.hair}" />
            <circle cx="28" cy="36" r="3" fill="#f43f5e" />
            <circle cx="72" cy="36" r="3" fill="#f43f5e" />`;
        }
      }

      let accessoryHtml = "";
      if (av.accessory === "bow") {
        accessoryHtml += `
          <g transform="translate(62, 23)">
            <circle cx="0" cy="0" r="4" fill="#f43f5e" />
            <ellipse cx="-5" cy="-1" rx="4" ry="2.5" fill="#fb7185" />
            <ellipse cx="5" cy="-1" rx="4" ry="2.5" fill="#fb7185" />
          </g>`;
      } else if (av.accessory === "cap") {
        accessoryHtml += `<path d="M29 31 C33 17, 67 17, 71 31 L76 32 L28 32 Z" fill="#0284c7" />`;
      }

      let faceHtml = "";
      if (status === "correct") {
        faceHtml = `
          <path d="M39 43 Q43 38 47 43" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
          <path d="M53 43 Q57 38 61 43" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
          <path d="M44 50 Q50 57 56 50 Z" fill="#ef4444" />`;
      } else if (status === "wrong") {
        faceHtml = `
          <path d="M40 40 L46 46 M46 40 L40 46" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
          <path d="M54 40 L60 46 M60 40 L54 46" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
          <path d="M44 54 Q50 49 56 54" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />`;
      } else if (status === "timeout") {
        faceHtml = `
          <line x1="39" y1="43" x2="46" y2="43" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />
          <line x1="54" y1="43" x2="61" y2="43" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="50" cy="52" r="2.5" fill="#1e293b" />`;
      } else {

          <circle cx="43" cy="43" r="2.8" fill="#1e293b" />
          <circle cx="57" cy="43" r="2.8" fill="#1e293b" />
          <circle cx="44" cy="42" r="1" fill="#ffffff" />
          <circle cx="58" cy="42" r="1" fill="#ffffff" />
          <path d="M45 51 Q50 55 55 51" fill="none" stroke="#991b1b" stroke-width="2" stroke-linecap="round" />`;
      }

      const glassesHtml = av.accessory === "glasses"
        ? `<g stroke="#334155" stroke-width="1.6" fill="none">
             <circle cx="43" cy="43" r="5.5" />
             <circle cx="57" cy="43" r="5.5" />
             <line x1="48.5" y1="43" x2="51.5" y2="43" />
           </g>`
        : "";

      let badgeHtml = "";
      if (status === "correct") {
        badgeHtml = `<div class="absolute -top-1 -right-1 w-6 h-6 bg-emerald-500 text-white rounded-full flex items-center justify-center text-xs shadow-md ring-2 ring-white animate-bounce"><i class="fa-solid fa-check"></i></div>`;
      } else if (status === "wrong") {
        badgeHtml = `<div class="absolute -top-1 -right-1 w-6 h-6 bg-rose-500 text-white rounded-full flex items-center justify-center text-xs shadow-md ring-2 ring-white"><i class="fa-solid fa-xmark"></i></div>`;
      } else if (status === "answered") {
        badgeHtml = `<div class="absolute -top-1 -right-1 w-6 h-6 bg-sky-500 text-white rounded-full flex items-center justify-center text-xs shadow-md ring-2 ring-white"><i class="fa-solid fa-bolt"></i></div>`;
      } else if (status === "unanswered") {
        badgeHtml = `<div class="absolute -top-1 -right-1 w-6 h-6 bg-amber-400 text-amber-950 rounded-full flex items-center justify-center text-xs shadow-md ring-2 ring-white animate-pulse"><i class="fa-solid fa-question"></i></div>`;
      } else if (status === "timeout") {

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    function copyTextFallback(text) {
      try {

    function normalizeAnswer(val) {
      return String(val || "").trim().toLowerCase().replace(/\s+/g, " ");
    }

    function normalizeMultiAnswer(val) {
      return String(val || "")
        .split("||")
        .map((s) => normalizeAnswer(s))
        .filter(Boolean)
        .sort()
        .join("||");
    }

    function checkAnswerCorrect(question, studentAns) {
      if (question.type === "multi_select") {
        return normalizeMultiAnswer(studentAns) === normalizeMultiAnswer(question.correctAnswer);
      }
      if (question.type === "scramble") {
        return normalizeAnswer(studentAns).replace(/\s+/g, "") === normalizeAnswer(question.correctAnswer).replace(/\s+/g, "");
      }
      return normalizeAnswer(studentAns) === normalizeAnswer(question.correctAnswer);
    }

    function parseImageChoiceOption(optStr) {
      const parts = String(optStr || "").split("|");
      if (parts.length >= 2) {
        return { media: parts[0].trim(), label: parts.slice(1).join("|").trim() };
      }
      return { media: parts[0].trim(), label: "" };
    }

    function getScrambledLetters(word, seed = 1) {
      const chars = String(word || "").replace(/\s+/g, "").toUpperCase().split("");
      if (chars.length <= 1) return chars;
      const arr = [...chars];
      let s = seed + chars.length * 17;
      for (let i = arr.length - 1; i > 0; i--) {
        s = (s * 9301 + 49297) % 233280;
        const j = Math.floor((s / 233280) * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      if (arr.join("") === chars.join("") && arr.length > 1) {
        [arr[0], arr[1]] = [arr[1], arr[0]];
      }
      return arr;
    }

    function formatDisplayAnswer(type, ansStr) {
      if (!ansStr) return "";
      if (type === "multi_select") {
        return String(ansStr).split("||").filter(Boolean).join(", ");
      }
      if (type === "image_choice") {
        const { media, label } = parseImageChoiceOption(ansStr);
        return media.startsWith("http") ? label || "Hình ảnh đã chọn" : `${media} ${label}`.trim();
      }
      return String(ansStr);
    }

    // Parse plain text extracted from .docx / .doc into structured questions
    function parseWordQuestionsText(rawText) {
      const lines = rawText
        .replace(/\r/g, "")
        .split("\n")
        .map((l) => l.trim())
        .filter(Boolean);

      const questions = [];
      let current = null;

      const pushCurrent = () => {
        if (!current || !current.text) return;
        const opts = current.options.filter(Boolean);
        let type = current.type || "mcq4";
        let correctAnswer = current.correctAnswer || "";

        if (opts.length === 0) {
          type = current.type === "scramble" ? "scramble" : "short_answer";
        } else if (
          opts.length === 2 &&
          opts.some((o) => normalizeAnswer(o) === "đúng") &&
          opts.some((o) => normalizeAnswer(o) === "sai")
        ) {
          type = "true_false";
        } else if (opts.length === 3 && type !== "multi_select" && type !== "image_choice") {
          type = "mcq3";
        } else if (type !== "multi_select" && type !== "image_choice") {
          type = "mcq4";
        }

        if (opts.length > 0 && correctAnswer && !correctAnswer.includes("||")) {
          const letters = ["A", "B", "C", "D"];
          const parts = correctAnswer
            .split(/[,;&]+/)
            .map((p) => p.trim())
            .filter(Boolean);
          if (parts.length > 1) {
            type = "multi_select";
            const mapped = parts.map((p) => {
              const idx = letters.indexOf(p.toUpperCase());
              return idx >= 0 && opts[idx] ? opts[idx] : p;
            });
            correctAnswer = mapped.join("||");
          } else if (parts.length === 1) {
            const idx = letters.indexOf(parts[0].toUpperCase());
            if (idx >= 0 && opts[idx]) {
              correctAnswer = opts[idx];
            }
          }
        }

        if (!correctAnswer && opts.length > 0) {
          correctAnswer = opts[0];
        }

        questions.push({
          id: `doc_${Date.now()}_${questions.length}`,
          type,
          text: current.text,
          image: current.image || "",
          options: type === "short_answer" || type === "scramble" ? [] : opts,
          correctAnswer,
          timeLimit: current.timeLimit || 20,
        });
      };

      for (const line of lines) {
        const qMatch = line.match(/^(?:Câu|Bài|Question)\s*\d+\s*[:.)\-]\s*(.+)$/i) || line.match(/^\d+\s*[.)]\s*(.+)$/);
        if (qMatch && !line.match(/^[A-D]\s*[.):\-]/i)) {
          pushCurrent();
          let qText = qMatch[1].trim();
          let qType = "";
          if (/\[ghép chữ\]|\[xếp từ\]/i.test(qText)) {
            qType = "scramble";
            qText = qText.replace(/\[ghép chữ\]|\[xếp từ\]/gi, "").trim();
          } else if (/\[chọn nhiều\]/i.test(qText)) {
            qType = "multi_select";
            qText = qText.replace(/\[chọn nhiều\]/gi, "").trim();
          } else if (/\[chọn hình\]/i.test(qText)) {
            qType = "image_choice";
            qText = qText.replace(/\[chọn hình\]/gi, "").trim();
          }
          current = { text: qText, options: [], correctAnswer: "", type: qType, image: "", timeLimit: 20 };
          continue;
        }

        if (!current) continue;

        const ansMatch = line.match(/^(?:Đáp án|ĐA|Answer|Kết quả)\s*[:\-]\s*(.+)$/i);
        if (ansMatch) {
          current.correctAnswer = ansMatch[1].trim();
          continue;
        }

        const timeMatch = line.match(/^(?:Thời gian|Time)\s*[:\-]\s*(\d+)/i);
        if (timeMatch) {
          current.timeLimit = Number(timeMatch[1]) || 20;
          continue;
        }

        const imgMatch = line.match(/^(?:Hình ảnh|Minh họa|Image)\s*[:\-]\s*(.+)$/i);
        if (imgMatch) {
          current.image = imgMatch[1].trim();
          continue;
        }

        const optMatch = line.match(/^(\*?)\s*([A-D])\s*[.):\-]\s*(.+)$/i);
        if (optMatch) {
          const isStarred = optMatch[1] === "*";
          const optText = optMatch[3].trim();
          current.options.push(optText);
          if (isStarred) {
            current.correctAnswer = current.correctAnswer
              ? `${current.correctAnswer}||${optText}`
              : optText;
            if (current.correctAnswer.includes("||")) {
              current.type = "multi_select";
            }
          }
          continue;
        }

        if (current.options.length === 0) {
          current.text += " " + line;
        }
      }

      pushCurrent();
      return questions;
    }

    function parseCSVLine(line) {
      const result = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          result.push(current.trim());
          current = "";
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    function sortLeaderboard(players) {
      return [...players].sort((a, b) => {
        if ((b.score || 0) !== (a.score || 0)) return (b.score || 0) - (a.score || 0);
        if ((b.correctCount || 0) !== (a.correctCount || 0)) return (b.correctCount || 0) - (a.correctCount || 0);
        return (a.totalResponseTimeMs || 0) - (b.totalResponseTimeMs || 0);
      });
    }

    function unsubscribeRoomListeners() {
      if (unsubRoom) { unsubRoom(); unsubRoom = null; }
      if (unsubPlayers) { unsubPlayers(); unsubPlayers = null; }
      if (unsubAnswers) { unsubAnswers(); unsubAnswers = null; }
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function subscribeToRoom(pin) {
      unsubscribeRoomListeners();
      state.currentPin = pin;
      state.roomData = null;
      state.roomPlayers = [];
      state.roomAnswers = [];
      if (!db || !state.user || !pin) return;

      unsubRoom = onSnapshot(
        publicDoc("rooms", pin),
        (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            state.roomData = data;
            if (data.theme && THEMES[data.theme]) {
              state.themeId = data.theme;
              updateThemeSwitcherUI();
            }
            syncTimerLoop();
          } else {
            state.roomData = null;
          }
          renderCurrentView();
        },
        (err) => console.error("Room snapshot error:", err)
      );

      // RULE 2: Simple collection listener, filter & sort in JS memory
      unsubPlayers = onSnapshot(
        publicCol("room_players"),
        (snap) => {
          const filtered = snap.docs
            .map((d) => ({ id: d.id, ...d.data() }))
            .filter((p) => p.pin === pin);
          state.roomPlayers = sortLeaderboard(filtered);
          renderCurrentView();
        },
        (err) => console.error("Players snapshot error:", err)
      );

      unsubAnswers = onSnapshot(
        publicCol("room_answers"),
        (snap) => {
          const filtered = snap.docs
            .map((d) => ({ id: d.id, ...d.data() }))
            .filter((a) => a.pin === pin);
          state.roomAnswers = filtered;
          renderCurrentView();
        },
        (err) => console.error("Answers snapshot error:", err)
      );
    }

    function syncTimerLoop() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      const r = state.roomData;
      if (!r) return;

      if (r.status === "paused") {
        state.remainingSec = Math.ceil((r.pausedRemainingMs || 0) / 1000);
        updateTimerDOMOnly();
        return;
      }
      if (r.status !== "question_active") {
        state.remainingSec = 0;
        return;
      }

      const tick = () => {
        const msLeft = Math.max(0, (r.questionEndTime || 0) - Date.now());
        const sec = Math.ceil(msLeft / 1000);
        if (sec !== state.remainingSec) {
          if (sec > 0 && sec <= 5) sfx.tick();
          state.remainingSec = sec;
          updateTimerDOMOnly();
        }
        // Host auto-reveals when time hits 0
        if (
          msLeft === 0 &&
          state.view === "teacher_game" &&
          r.hostUid === state.user?.uid &&
          state.revealTriggeredForQ !== r.currentQuestionIndex
        ) {
          state.revealTriggeredForQ = r.currentQuestionIndex;
          handleRevealAnswer();
        }
      };
      tick();
      timerInterval = setInterval(tick, 250);
    }

    function updateTimerDOMOnly() {
      const r = state.roomData;
      if (!r) return;
      const teacherTimer = document.getElementById("teacher-timer-badge");
      if (teacherTimer && r.status === "question_active") {
        teacherTimer.innerHTML = `<i class="fa-regular fa-clock mr-1.5"></i>${state.remainingSec}s`;
        if (state.remainingSec <= 5) {
          teacherTimer.className = "flex items-center px-4 py-1.5 rounded-2xl font-black text-xl shadow-inner bg-rose-500 text-white animate-pulse";
        }
      }
      const stuTimerText = document.getElementById("student-timer-text");
      const stuTimerBar = document.getElementById("student-timer-bar");
      if (stuTimerText && r.status === "question_active") {
        stuTimerText.textContent = `⏱️ Còn ${state.remainingSec} giây`;
        stuTimerText.className = state.remainingSec <= 5 ? "text-rose-600 animate-pulse" : "text-sky-700";
      }
      if (stuTimerBar && r.currentQuestionPublic) {
        const pct = Math.min(100, (state.remainingSec / (r.currentQuestionPublic.timeLimit || 20)) * 100);
        stuTimerBar.style.width = `${pct}%`;
        stuTimerBar.className = `h-full transition-all duration-300 ${state.remainingSec <= 5 ? "bg-rose-500" : "bg-emerald-500"}`;
      }
    }

    async function launchQuestion(index) {
      if (!db || !state.user || !state.currentPin || !state.activeQuiz) return;
      const q = state.activeQuiz.questions[index];
      if (!q) return;

      sfx.startQuestion();
      state.revealTriggeredForQ = null;
      const now = Date.now();
      const timeLimit = Number(q.timeLimit) || state.activeQuiz.settings?.defaultTime || 20;

      // Never include correctAnswer in public question payload!
      const publicQuestion = {
        index,
        type: q.type,
        text: q.text,
        image: q.image || "",
        options: q.options || [],
        scrambledLetters: q.type === "scramble" ? getScrambledLetters(q.correctAnswer, index + 1) : [],
        timeLimit,
      };

      await Promise.all(
        state.roomPlayers.map((p) =>
          updateDoc(publicDoc("room_players", `${state.currentPin}_${p.uid}`), {
            lastResult: null,
            lastPointsEarned: 0,
          })
        )
      );

      await updateDoc(publicDoc("rooms", state.currentPin), {
        status: "question_active",
        currentQuestionIndex: index,
        currentQuestionPublic: publicQuestion,
        revealedAnswer: null,
        questionStartTime: now,
        questionEndTime: now + timeLimit * 1000,
        pausedRemainingMs: null,
        updatedAt: now,
      });

      state.view = "teacher_game";
      renderCurrentView();
    }

    async function handleRevealAnswer() {
      if (!db || !state.user || !state.currentPin || !state.roomData || !state.activeQuiz) return;
      if (state.roomData.status === "question_reveal" || state.roomData.status === "finished") return;

      const qIndex = state.roomData.currentQuestionIndex;
      const question = state.activeQuiz.questions[qIndex];
      if (!question) return;

      const settings = state.roomData.settings || { basePoints: 500, speedBonus: 500, streakBonus: 100 };
      const timeLimitMs = (question.timeLimit || 20) * 1000;
      const qStart = state.roomData.questionStartTime || Date.now() - timeLimitMs;

      const answersForQ = state.roomAnswers.filter((a) => a.qIndex === qIndex);
      const answerByUid = {};
      answersForQ.forEach((a) => { answerByUid[a.uid] = a; });

      let correctCount = 0;
      let wrongCount = 0;
      let unansweredCount = 0;
      const fastestList = [];

      await Promise.all(
        state.roomPlayers.map(async (player) => {
          const ans = answerByUid[player.uid];
          const existingHistory = Array.isArray(player.history) ? player.history : [];
          if (existingHistory.some((h) => h.qIndex === qIndex)) return;

          let isCorrect = false;
          let pointsEarned = 0;
          let responseTimeMs = timeLimitMs;
          let resultStatus = "timeout";
          let nextStreak = 0;

          if (ans) {
            responseTimeMs = Math.max(200, Math.min(timeLimitMs, (ans.submittedAt || Date.now()) - qStart));
            isCorrect = checkAnswerCorrect(question, ans.answer);

            if (isCorrect) {
              correctCount++;
              resultStatus = "correct";
              nextStreak = (player.streak || 0) + 1;
              const speedRatio = Math.max(0, 1 - responseTimeMs / timeLimitMs);
              const speedPts = Math.round(speedRatio * (settings.speedBonus || 0));
              const streakPts = nextStreak >= 2 ? (nextStreak - 1) * (settings.streakBonus || 0) : 0;
              pointsEarned = (settings.basePoints || 500) + speedPts + streakPts;

              fastestList.push({
                uid: player.uid,
                name: player.name,
                avatarId: player.avatarId,
                timeMs: responseTimeMs,
                points: pointsEarned,
              });
            } else {
              wrongCount++;
              resultStatus = "wrong";
              nextStreak = 0;
            }
          } else {
            unansweredCount++;
            resultStatus = "timeout";
            nextStreak = 0;
          }

          const newHistoryItem = {
            qIndex,
            questionText: question.text,
            correctAnswer: formatDisplayAnswer(question.type, question.correctAnswer),
            studentAnswer: ans ? formatDisplayAnswer(question.type, ans.answer) : null,
            isCorrect,
            resultStatus,
            points: pointsEarned,
            timeMs: ans ? responseTimeMs : null,
          };

          await updateDoc(publicDoc("room_players", `${state.currentPin}_${player.uid}`), {
            score: (player.score || 0) + pointsEarned,
            correctCount: (player.correctCount || 0) + (resultStatus === "correct" ? 1 : 0),
            wrongCount: (player.wrongCount || 0) + (resultStatus === "wrong" ? 1 : 0),
            unansweredCount: (player.unansweredCount || 0) + (resultStatus === "timeout" ? 1 : 0),
            streak: nextStreak,
            totalResponseTimeMs: (player.totalResponseTimeMs || 0) + (ans ? responseTimeMs : timeLimitMs),
            lastResult: resultStatus,
            lastPointsEarned: pointsEarned,
            history: [...existingHistory, newHistoryItem],
          });
        })
      );

      fastestList.sort((a, b) => a.timeMs - b.timeMs);

      await updateDoc(publicDoc("rooms", state.currentPin), {
        status: "question_reveal",
        revealedAnswer: {
          qIndex,
          correctAnswer: question.correctAnswer,
          stats: {
            total: state.roomPlayers.length,
            answered: answersForQ.length,
            correct: correctCount,
            wrong: wrongCount,
            unanswered: unansweredCount,
          },
          fastest: fastestList.slice(0, 3),
        },
        updatedAt: Date.now(),
      });

      sfx.correct();
    }

            pin: cleanPin,

            className: cleanClass || "Tiểu học",

            correctCount: 0,
            wrongCount: 0,

            totalResponseTimeMs: 0,
            lastResult: null,
            lastPointsEarned: 0,
            history: [],

            name: cleanName,
            className: cleanClass || existingPlayer.data().className,

          });

      } catch (err) {

    async function handleStudentSubmitAnswer(answerValue) {
      if (!db || !state.user || !state.currentPin || !state.roomData || state.roomData.status !== "question_active") return;
      const qIndex = state.roomData.currentQuestionIndex;
      const already = state.roomAnswers.some((a) => a.uid === state.user.uid && a.qIndex === qIndex);
      if (already || state.studentSubmitting) return;

      const cleanAns = String(answerValue ?? "").trim();
      if (!cleanAns) return;

      state.studentSubmitting = true;
      sfx.click();
      try {
        const myPlayer = state.roomPlayers.find((p) => p.uid === state.user.uid);
        const answerDocId = `${state.currentPin}_q${qIndex}_${state.user.uid}`;
        await setDoc(publicDoc("room_answers", answerDocId), {
          pin: state.currentPin,
          qIndex,
          uid: state.user.uid,
          studentName: myPlayer?.name || state.studentName,
          answer: cleanAns,
          submittedAt: Date.now(),
        });
      } catch (err) {
        console.error("Submit answer error:", err);
      } finally {
        state.studentSubmitting = false;
      }
    }

            const file = e.target.files?.[0];

            try {
              let extractedText = "";
              if (/\.docx$/i.test(file.name)) {
                if (typeof window.mammoth === "undefined") {

                  return;
                }
                const arrayBuffer = await file.arrayBuffer();
                const res = await window.mammoth.extractRawText({ arrayBuffer });
                extractedText = res.value || "";
              } else {
                const raw = await file.text();
                if (/<html|<body|<p/i.test(raw)) {
                  const parser = new DOMParser();
                  const docEl = parser.parseFromString(raw, "text/html");
                  extractedText = docEl.body?.innerText || raw.replace(/<[^>]+>/g, "\n");
                } else {
                  extractedText = raw;
                }
              }

              const parsed = parseWordQuestionsText(extractedText);
              if (parsed.length === 0) {
                showAlert(
                  "Không nhận diện được câu hỏi",
                  "Vui lòng bấm 'Tải mẫu Word' để xem đúng định dạng (Câu 1: ..., A. ..., *B. ..., Đáp án: A) và lưu dưới dạng .docx nhé!"
                );
                return;
              }
              await handleSaveQuestionSet({
                id: `quiz_word_${Date.now()}`,
                title: file.name.replace(/\.(docx|doc|txt)$/i, ""),
                subject: "Nhập từ Word",
                settings: { basePoints: 500, speedBonus: 500, streakBonus: 100, defaultTime: 20 },
                questions: parsed,
              });
              showAlert("Nhập từ Word thành công! 🎉", `Đã tự động nhận diện và thêm ${parsed.length} câu hỏi vào ngân hàng.`);
            } catch (err) {
              console.error("Word import error:", err);
              showAlert("Lỗi đọc file Word", "Không thể đọc file này. Nếu là file .doc đời cũ (Word 97-2003), thầy/cô hãy mở bằng Word rồi chọn Save As sang .docx nhé!");
            } finally {
              e.target.value = "";
            }
          };
        }

        const csvInput = document.getElementById("input-import-csv");
        if (csvInput) {
          csvInput.onchange = (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (evt) => {
              try {
                const text = String(evt.target?.result || "").replace(/^\uFEFF/, "");
                const lines = text.split(/\r?\n/).filter((l) => l.trim().length > 0);
                if (lines.length < 2) {
                  showAlert("File trống", "File CSV cần có dòng tiêu đề và ít nhất 1 câu hỏi.");
                  return;
                }
                const imported = [];
                for (let i = 1; i < lines.length; i++) {
                  const cols = parseCSVLine(lines[i]);
                  if (cols.length < 8) continue;
                  const [typeRaw, qText, img, optA, optB, optC, optD, correct, timeStr] = cols;
                  const validTypes = ["mcq4", "mcq3", "true_false", "image_choice", "multi_select", "scramble", "short_answer"];
                  const type = validTypes.includes(typeRaw) ? typeRaw : "mcq4";
                  let options = [];
                  if (type === "true_false") options = ["Đúng", "Sai"];
                  else if (type === "mcq3") options = [optA, optB, optC].filter(Boolean);
                  else if (["mcq4", "image_choice", "multi_select"].includes(type)) options = [optA, optB, optC, optD].filter(Boolean);
                  imported.push({
                    id: `imp_${Date.now()}_${i}`,
                    type,
                    text: qText,
                    image: img || "",
                    options,
                    correctAnswer: correct,
                    timeLimit: Number(timeStr) || 20,
                  });
                }
                if (imported.length === 0) {
                  showAlert("Không đọc được câu hỏi", "Vui lòng xuất thử 1 bộ câu hỏi mẫu để xem đúng định dạng CSV.");
                  return;
                }
                await handleSaveQuestionSet({
                  id: `quiz_imp_${Date.now()}`,
                  title: file.name.replace(/\.csv$/i, ""),
                  subject: "Nhập từ Excel/CSV",
                  settings: { basePoints: 500, speedBonus: 500, streakBonus: 100, defaultTime: 20 },
                  questions: imported,
                });
                showAlert("Nhập thành công!", `Đã thêm ${imported.length} câu hỏi vào ngân hàng.`);
              } catch {
                showAlert("Lỗi đọc file", "Không thể đọc file CSV này.");
              }
            };
            reader.readAsText(file, "UTF-8");
            e.target.value = "";
          };
        }

        root.querySelectorAll("[data-play-quiz]").forEach((btn) => {
          btn.onclick = () => {
            const q = state.questionSets.find((x) => x.id === btn.getAttribute("data-play-quiz"));
            if (q) handleCreateRoom(q);
          };
        });
        root.querySelectorAll("[data-edit-quiz]").forEach((btn) => {
          btn.onclick = () => {
            sfx.click();
            const q = state.questionSets.find((x) => x.id === btn.getAttribute("data-edit-quiz"));
            if (q) {
              state.editingSet = JSON.parse(JSON.stringify(q));
              renderCurrentView();
            }
          };
        });
        root.querySelectorAll("[data-export-quiz]").forEach((btn) => {
          btn.onclick = () => {
            sfx.click();
            const quiz = state.questionSets.find((x) => x.id === btn.getAttribute("data-export-quiz"));
            if (!quiz) return;
            const headers = ["DangCauHoi", "CauHoi", "HinhAnh", "PhuongAnA", "PhuongAnB", "PhuongAnC", "PhuongAnD", "DapAnDung", "ThoiGianGiay"];
            const rows = (quiz.questions || []).map((q) => [
              q.type, q.text, q.image || "", q.options?.[0] || "", q.options?.[1] || "", q.options?.[2] || "", q.options?.[3] || "", q.correctAnswer, q.timeLimit || 20,
            ]);
            downloadCSV(`NganHang_${quiz.title.replace(/\s+/g, "_")}.csv`, [headers, ...rows]);
          };
        });
        root.querySelectorAll("[data-delete-quiz]").forEach((btn) => {
          btn.onclick = () => {
            const quiz = state.questionSets.find((x) => x.id === btn.getAttribute("data-delete-quiz"));
            if (!quiz) return;
            showConfirm("Xóa bộ câu hỏi?", `Bạn có chắc muốn xóa bộ "${quiz.title}" không?`, async () => {
              if (db) await deleteDoc(publicDoc("question_sets", quiz.id));
            });
          };
        });
      } else {
        root.querySelectorAll("[data-view-hist]").forEach((btn) => {
          btn.onclick = () => {
            const m = state.matchHistory.find((x) => x.id === btn.getAttribute("data-view-hist"));
            if (m) showInspectHistoryModal(m);
          };
        });
        root.querySelectorAll("[data-exp-hist]").forEach((btn) => {
          btn.onclick = () => {
            const m = state.matchHistory.find((x) => x.id === btn.getAttribute("data-exp-hist"));
            if (m) exportResultsExcel(m.players || [], m.quizTitle || "TranDau", m.totalQuestions || 1);
          };
        });
      }
    }

    function bindQuizEditorEvents() {
      const form = state.editingSet;
      if (!form) return;
      const redrawEditor = () => renderCurrentView();

      document.getElementById("btn-ed-cancel").onclick = () => {
        state.editingSet = null;
        renderCurrentView();
      };
      document.getElementById("btn-ed-save").onclick = () => handleSaveQuestionSet(form);
      document.getElementById("ed-title").oninput = (e) => (form.title = e.target.value);
      document.getElementById("ed-subject").oninput = (e) => (form.subject = e.target.value);
      document.getElementById("ed-base").oninput = (e) => (form.settings.basePoints = Number(e.target.value));
      document.getElementById("ed-speed").oninput = (e) => (form.settings.speedBonus = Number(e.target.value));
      document.getElementById("ed-streak").oninput = (e) => (form.settings.streakBonus = Number(e.target.value));

      document.getElementById("btn-ed-add-q").onclick = () => {
        form.questions.push({
          id: `q_${Date.now()}`,
          type: "mcq4",
          text: "",
          image: "",
          options: ["", "", "", ""],
          correctAnswer: "",
          timeLimit: form.settings?.defaultTime || 20,
        });
        redrawEditor();
      };

      document.querySelectorAll("[data-q-type]").forEach((sel) => {
        sel.onchange = (e) => {
          const idx = Number(sel.getAttribute("data-q-type"));
          const newType = e.target.value;
          form.questions[idx].type = newType;
          if (newType === "true_false") {
            form.questions[idx].options = ["Đúng", "Sai"];
            form.questions[idx].correctAnswer = "Đúng";
          } else if (newType === "mcq3") {
            form.questions[idx].options = ["", "", ""];
            form.questions[idx].correctAnswer = "";
          } else if (["mcq4", "image_choice", "multi_select"].includes(newType)) {
            form.questions[idx].options = newType === "image_choice" ? ["🍎|Táo", "🍌|Chuối", "🍊|Cam", "🍇|Nho"] : ["", "", "", ""];
            form.questions[idx].correctAnswer = "";
          } else {
            form.questions[idx].options = [];
            form.questions[idx].correctAnswer = "";
          }
          redrawEditor();
        };
      });

      document.querySelectorAll("[data-q-time]").forEach((inp) => {
        inp.oninput = (e) => (form.questions[Number(inp.getAttribute("data-q-time"))].timeLimit = Number(e.target.value));
      });
      document.querySelectorAll("[data-q-del]").forEach((btn) => {
        btn.onclick = () => {
          const idx = Number(btn.getAttribute("data-q-del"));
          form.questions.splice(idx, 1);
          redrawEditor();
        };
      });
      document.querySelectorAll("[data-q-text]").forEach((inp) => {
        inp.oninput = (e) => (form.questions[Number(inp.getAttribute("data-q-text"))].text = e.target.value);
      });
      document.querySelectorAll("[data-q-img]").forEach((inp) => {
        inp.oninput = (e) => (form.questions[Number(inp.getAttribute("data-q-img"))].image = e.target.value);
      });
      document.querySelectorAll("[data-q-correct]").forEach((inp) => {
        inp.oninput = (e) => (form.questions[Number(inp.getAttribute("data-q-correct"))].correctAnswer = e.target.value);
      });
      document.querySelectorAll("[data-q-opt]").forEach((inp) => {
        inp.oninput = (e) => {
          const [qi, oi] = inp.getAttribute("data-q-opt").split(":").map(Number);
          const q = form.questions[qi];
          const oldVal = q.options[oi];
          q.options[oi] = e.target.value;
          if (q.type === "multi_select") {
            const parts = String(q.correctAnswer || "").split("||").filter(Boolean);
            const pos = parts.indexOf(oldVal);
            if (pos >= 0) {
              parts[pos] = e.target.value;
              q.correctAnswer = parts.filter(Boolean).join("||");
            }
          } else if (q.correctAnswer === oldVal) {
            q.correctAnswer = e.target.value;
          }
        };
      });
      document.querySelectorAll("[data-q-mark-correct]").forEach((btn) => {
        btn.onclick = () => {
          const [qi, oi] = btn.getAttribute("data-q-mark-correct").split(":").map(Number);
          const q = form.questions[qi];
          const val = q.options[oi];
          if (!val) return;
          if (q.type === "multi_select") {
            const parts = String(q.correctAnswer || "").split("||").filter(Boolean);
            const exists = parts.includes(val);
            const next = exists ? parts.filter((x) => x !== val) : [...parts, val];
            q.correctAnswer = next.join("||");
          } else {
            q.correctAnswer = val;
          }
          redrawEditor();
        };
      });
    }

                  <button id="btn-cancel-lobby" type="button" class="px-4 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm">Hủy</button>
                </div>
                <button id="btn-start-game" type="button" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-black text-lg shadow-lg border-b-4 border-green-800 active:border-b-0 active:translate-y-1 transition-all">
                  <i class="fa-solid fa-play mr-2"></i> BẮT ĐẦU TRÒ CHƠI
                </button>
              </div>
            </div>
          </div>

          <div class="flex-1 p-4 sm:p-6 border-t-4 border-amber-700/20 ${theme.floorClass}">
            <div class="max-w-7xl mx-auto">
              <div class="mb-4">
                <span class="inline-block font-black text-base sm:text-lg text-amber-950 bg-white/85 backdrop-blur px-4 py-1.5 rounded-full shadow-sm">
                  🪑 Lớp học đang tập hợp (${state.roomPlayers.length} học sinh)
                </span>
              </div>
              ${desksHtml}
            </div>
          </div>
        </main>`;

      document.getElementById("btn-copy-link").onclick = () => {
        sfx.click();
        copyTextFallback(joinUrl);
        state.copiedPin = true;
        renderCurrentView();
        setTimeout(() => {
          state.copiedPin = false;
          if (state.view === "teacher_lobby") renderCurrentView();
        }, 2000);
      };
      document.getElementById("btn-lock-room").onclick = async () => {
        sfx.click();
        await updateDoc(publicDoc("rooms", state.currentPin), { isLocked: !r.isLocked });
      };
      document.getElementById("btn-cancel-lobby").onclick = () => {
        unsubscribeRoomListeners();
        state.currentPin = "";
        state.roomData = null;
        state.view = "teacher_dashboard";
        renderCurrentView();
      };
      document.getElementById("btn-start-game").onclick = () => {
        if (state.roomPlayers.length === 0) {
          showConfirm("Chưa có học sinh nào!", "Hiện chưa có học sinh vào phòng. Thầy/cô vẫn muốn mở câu hỏi đầu tiên chứ?", () => launchQuestion(0));
        } else {
          launchQuestion(0);
        }
      };
    }

    // --- VIEW 4: TEACHER LIVE GAME ARENA ---
    function renderTeacherGameView(root) {
      const r = state.roomData;
      const theme = THEMES[state.themeId] || THEMES.classroom;
      if (!r || !r.currentQuestionPublic) return;

      const qPub = r.currentQuestionPublic;
      const currentQAnswers = state.roomAnswers.filter((a) => a.qIndex === r.currentQuestionIndex);
      const answeredUidSet = new Set(currentQAnswers.map((a) => a.uid));

      // Media Illustration on Chalkboard
      let mediaHtml = "";
      if (qPub.image) {
        mediaHtml = qPub.image.startsWith("http")
          ? `<img src="${escapeHtml(qPub.image)}" onerror="this.style.display='none'" alt="Minh họa" class="max-h-28 rounded-xl border-2 border-white/30 shadow mx-auto" />`
          : `<div class="text-5xl leading-none">${escapeHtml(qPub.image)}</div>`;
      }

      // Options / Scramble / Image Choice / Short Answer on Chalkboard
      let optionsBoardHtml = "";
      if (qPub.type === "short_answer" || qPub.type === "scramble") {
        if (r.status === "question_reveal") {
          const letters = String(r.revealedAnswer?.correctAnswer || "")
            .split("")
            .map((ch) => `<span class="w-11 h-12 rounded-xl bg-emerald-400 text-emerald-950 font-black text-2xl flex items-center justify-center shadow-lg border-b-4 border-emerald-700">${escapeHtml(ch.toUpperCase())}</span>`)
            .join("");
          optionsBoardHtml = `<div class="flex flex-wrap justify-center gap-2 py-2">${letters}</div>`;
        } else if (qPub.type === "scramble") {
          const scrambled = qPub.scrambledLetters || [];
          const tiles = scrambled
            .map((ch) => `<span class="w-11 h-12 rounded-xl bg-amber-300 text-amber-950 font-black text-2xl flex items-center justify-center shadow-lg border-b-4 border-amber-600">${escapeHtml(ch)}</span>`)
            .join("");
          optionsBoardHtml = `
            <div class="flex flex-col items-center gap-2 py-1">
              <div class="flex flex-wrap justify-center gap-2">${tiles}</div>
              <span class="text-xs font-bold text-amber-200">🧩 Học sinh đang ghép các chữ cái trên máy cá nhân...</span>
            </div>`;
        } else {
          optionsBoardHtml = `<div class="flex justify-center py-2"><div class="px-5 py-2.5 rounded-2xl bg-white/10 border border-white/25 text-amber-200 font-bold text-sm">✍️ Học sinh đang nhập câu trả lời ngắn trên máy cá nhân...</div></div>`;
        }
      } else if (qPub.type === "image_choice") {
        optionsBoardHtml = `
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mt-2">
            ${(qPub.options || [])
              .map((opt, idx) => {
                const letter = ["A", "B", "C", "D"][idx] || idx + 1;
                const { media, label } = parseImageChoiceOption(opt);
                const isCorrect = r.status === "question_reveal" && normalizeAnswer(opt) === normalizeAnswer(r.revealedAnswer?.correctAnswer);
                const isDimmed = r.status === "question_reveal" && !isCorrect;
                const mediaEl = media.startsWith("http")
                  ? `<img src="${escapeHtml(media)}" onerror="this.src='https://placehold.co/64x64/e2e8f0/475569?text=IMG'" alt="${escapeHtml(label)}" class="h-14 w-14 object-cover rounded-xl mx-auto" />`
                  : `<div class="text-4xl leading-none">${escapeHtml(media)}</div>`;
                return `
                  <div class="flex flex-col items-center justify-center gap-1 p-2.5 rounded-2xl font-bold text-xs sm:text-sm transition-all ${
                    isCorrect ? "bg-emerald-400 text-emerald-950 ring-4 ring-white shadow-lg scale-105"
                    : isDimmed ? "bg-white/10 text-white/40"
                    : "bg-white/15 text-white border border-white/20"
                  }">
                    <span class="self-start px-2 py-0.5 rounded-md text-[10px] font-black ${isCorrect ? "bg-emerald-900 text-white" : "bg-amber-400 text-amber-950"}">${letter}</span>
                    ${mediaEl}
                    ${label ? `<span class="truncate max-w-full">${escapeHtml(label)}</span>` : ""}
                  </div>`;
              })
              .join("")}
          </div>`;
      } else {
        const correctMultiSet = new Set(
          qPub.type === "multi_select"
            ? String(r.revealedAnswer?.correctAnswer || "").split("||").map((s) => normalizeAnswer(s))
            : []
        );
        optionsBoardHtml = `
          ${qPub.type === "multi_select" ? `<div class="text-center text-xs font-extrabold text-amber-300 mb-1">☑️ Dạng chọn NHIỀU đáp án đúng</div>` : ""}
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-1">
            ${(qPub.options || [])
              .map((opt, idx) => {
                const letter = ["A", "B", "C", "D"][idx] || idx + 1;
                const isCorrect =
                  r.status === "question_reveal" &&
                  (qPub.type === "multi_select"
                    ? correctMultiSet.has(normalizeAnswer(opt))
                    : normalizeAnswer(opt) === normalizeAnswer(r.revealedAnswer?.correctAnswer));
                const isDimmed = r.status === "question_reveal" && !isCorrect;
                return `
                  <div class="flex items-center gap-3 px-4 py-2.5 rounded-2xl font-bold text-sm sm:text-base transition-all ${
                    isCorrect ? "bg-emerald-400 text-emerald-950 ring-4 ring-white shadow-lg scale-[1.02]"
                    : isDimmed ? "bg-white/10 text-white/40"
                    : "bg-white/15 text-white border border-white/20"
                  }">
                    <span class="w-7 h-7 rounded-lg flex items-center justify-center font-black text-sm shrink-0 ${
                      isCorrect ? "bg-emerald-900 text-white" : "bg-amber-400 text-amber-950"
                    }">${letter}</span>
                    <span class="truncate">${escapeHtml(opt)}</span>
                    ${isCorrect ? `<i class="fa-solid fa-circle-check ml-auto text-lg"></i>` : ""}
                  </div>`;
              })
              .join("")}
          </div>`;
      }

      // Top 3 Leaderboard HTML
      const medals = ["🥇", "🥈", "🥉"];
      const rankBgs = [
        "bg-gradient-to-r from-amber-200 to-yellow-100 border-amber-400",
        "bg-gradient-to-r from-slate-200 to-slate-100 border-slate-300",
        "bg-gradient-to-r from-orange-200 to-amber-100 border-orange-300",
      ];
      const top3Html =
        state.roomPlayers.length === 0
          ? `<p class="text-xs text-slate-500 text-center py-4 font-semibold">Chưa có dữ liệu điểm</p>`
          : state.roomPlayers
              .slice(0, 3)
              .map(
                (p, idx) => `
                <div class="flex items-center justify-between px-3 py-2 rounded-2xl border-2 shadow-sm ${rankBgs[idx]}">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="text-xl">${medals[idx]}</span>
                    <div class="min-w-0">
                      <p class="font-black text-sm text-slate-900 truncate">${escapeHtml(p.name)}</p>
                      <p class="text-[11px] font-bold text-slate-600">Đúng ${p.correctCount || 0} câu${p.streak >= 2 ? ` • 🔥 Chuỗi ${p.streak}` : ""}</p>
                    </div>
                  </div>
                  <span class="font-black text-base text-amber-950 shrink-0 ml-2">${p.score || 0}đ</span>
                </div>`
              )
              .join("");

      const fastestHtml =
        r.status === "question_reveal" && r.revealedAnswer?.fastest?.length > 0
          ? `<div class="mt-3 pt-2.5 border-t border-amber-200">
               <p class="text-[11px] font-black text-orange-700 uppercase mb-1.5"><i class="fa-solid fa-bolt mr-1"></i>Nhanh nhất câu này</p>
               <div class="flex flex-wrap gap-1.5">
                 ${r.revealedAnswer.fastest
                   .map((f, i) => `<span class="inline-flex items-center bg-white px-2.5 py-1 rounded-xl text-xs font-bold text-slate-800 border border-orange-200 shadow-sm">#${i + 1} ${escapeHtml(f.name)} (${(f.timeMs / 1000).toFixed(1)}s)</span>`)
                   .join("")}
               </div>
             </div>`
          : "";

      // Student Desks Grid HTML
      const desksGridHtml = state.roomPlayers
        .map((p) => {
          let deskStatus = "idle";
          if (r.status === "question_active" || r.status === "paused") {
            deskStatus = answeredUidSet.has(p.uid) ? "answered" : "unanswered";
          } else if (r.status === "question_reveal" || r.status === "finished") {
            deskStatus = p.lastResult || "timeout";
          }

          const borderCls =
            deskStatus === "correct" ? "border-emerald-400 bg-emerald-50/95 ring-2 ring-emerald-300"
            : deskStatus === "wrong" ? "border-rose-400 bg-rose-50/95"
            : deskStatus === "answered" ? "border-sky-400 bg-sky-50/95"
            : "border-amber-200/90 bg-white/85";

          const statusText =
            deskStatus === "correct" ? `<span class="text-emerald-600">Đúng!</span>`
            : deskStatus === "wrong" ? `<span class="text-rose-600">Sai</span>`
            : deskStatus === "answered" ? `<span class="text-sky-600">Đã gửi</span>`
            : deskStatus === "timeout" ? `<span class="text-slate-500">Hết giờ</span>`
            : `<span class="text-amber-700">Đang nghĩ...</span>`;

          const plusPts =
            r.status === "question_reveal" && p.lastPointsEarned > 0
              ? `<span class="absolute -top-2.5 left-2 bg-emerald-500 text-white text-[11px] font-black px-2 py-0.5 rounded-full shadow animate-bounce">+${p.lastPointsEarned}</span>`
              : "";

          return `
            <div data-inspect-uid="${escapeHtml(p.uid)}" class="cursor-pointer relative flex flex-col items-center rounded-2xl p-2 shadow-md border-2 transition-all duration-300 hover:scale-105 ${borderCls}">
              ${plusPts}
              ${renderStudentAvatarSVG(p.avatarId, deskStatus)}
              <div class="mt-1 w-full bg-amber-950/90 text-white px-2 py-0.5 rounded-full text-center text-xs font-extrabold truncate shadow-sm">${escapeHtml(p.name)}</div>
              <div class="mt-1 flex items-center justify-between w-full px-1 text-[11px] font-extrabold">
                <span class="text-amber-900">${p.score || 0} điểm</span>
                ${statusText}
              </div>
            </div>`;
        })
        .join("");

      // Timer badge styling
      const timerBadgeCls =
        r.status === "question_reveal" ? "bg-emerald-500 text-white"
        : state.remainingSec <= 5 && r.status === "question_active" ? "bg-rose-500 text-white animate-pulse"
        : "bg-white text-slate-900";

      const timerLabel =
        r.status === "question_reveal" ? "ĐÃ CÔNG BỐ"
        : r.status === "paused" ? `TẠM DỪNG (${state.remainingSec}s)`
        : `${state.remainingSec}s`;

      // Control buttons
      let leftControlsHtml = "";
      if (r.status === "question_active" || r.status === "paused") {
        leftControlsHtml = `
          <button id="btn-pause-resume" type="button" class="px-4 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-950 font-extrabold text-sm">
            <i class="fa-solid ${r.status === "paused" ? "fa-play" : "fa-pause"} mr-1.5"></i> ${r.status === "paused" ? "Tiếp tục" : "Tạm dừng"}
          </button>
          <button id="btn-reveal-ans" type="button" class="px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-black text-sm shadow border-b-4 border-sky-800 active:border-b-0 active:translate-y-0.5">
            <i class="fa-solid fa-eye mr-1.5"></i> Kết thúc & Công bố đáp án
          </button>`;
      } else if (r.status === "question_reveal" && r.currentQuestionIndex + 1 < r.totalQuestions) {
        leftControlsHtml = `
          <button id="btn-next-q" type="button" class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm shadow-md border-b-4 border-emerald-800 active:border-b-0 active:translate-y-0.5">
            Câu hỏi tiếp theo <i class="fa-solid fa-forward-step ml-1.5"></i>
          </button>`;
      } else if (r.status === "question_reveal") {
        leftControlsHtml = `
          <button id="btn-finish-match" type="button" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white font-black text-sm shadow-md border-b-4 border-orange-700 animate-pulse">
            <i class="fa-solid fa-trophy mr-1.5"></i> Tổng kết & Trao giải!
          </button>`;
      }

      root.innerHTML = `
        <main class="flex-1 flex flex-col ${theme.wallBg}">
          <div class="max-w-[1440px] w-full mx-auto px-3 sm:px-5 pt-3 pb-4 grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch">
            <!-- Teacher & Chalkboard -->
            <div class="lg:col-span-8 flex items-end gap-2">
              <div class="hidden sm:block">${renderTeacherSVG()}</div>
              <div class="flex-1 rounded-3xl border-[10px] shadow-2xl p-4 sm:p-6 text-white flex flex-col justify-between min-h-[260px] ${theme.boardBg}">
                <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-white/15">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="px-3 py-1 rounded-xl bg-white/15 font-extrabold text-xs sm:text-sm">📚 ${escapeHtml(r.subject)}</span>
                    <span class="px-3 py-1 rounded-xl bg-amber-400 text-amber-950 font-black text-xs sm:text-sm">Câu ${r.currentQuestionIndex + 1} / ${r.totalQuestions}</span>
                    <span class="px-2.5 py-1 rounded-xl bg-black/25 font-mono text-xs">PIN: ${escapeHtml(state.currentPin)}</span>
                  </div>
                  <div id="teacher-timer-badge" class="flex items-center px-4 py-1.5 rounded-2xl font-black text-xl shadow-inner ${timerBadgeCls}">
                    <i class="fa-regular fa-clock mr-1.5"></i>${timerLabel}
                  </div>
                </div>

                <div class="my-4 text-center space-y-3">
                  ${mediaHtml}
                  <h2 class="text-xl sm:text-2xl md:text-3xl font-black leading-snug drop-shadow">${escapeHtml(qPub.text)}</h2>
                </div>

                ${optionsBoardHtml}
              </div>
            </div>

            <!-- Live Stats & Top 3 Leaderboard -->
            <div class="lg:col-span-4 flex flex-col gap-3">
              <div class="grid grid-cols-4 gap-2 bg-white/95 rounded-2xl p-2.5 shadow-md border-2 border-amber-200 text-center">
                <div class="bg-slate-50 rounded-xl p-1.5">
                  <div class="text-[10px] font-extrabold text-slate-500 uppercase">Sĩ số</div>
                  <div class="text-lg font-black text-slate-800">${state.roomPlayers.length}</div>
                </div>
                <div class="bg-sky-50 rounded-xl p-1.5">
                  <div class="text-[10px] font-extrabold text-sky-600 uppercase">Đã gửi</div>
                  <div class="text-lg font-black text-sky-700">${currentQAnswers.length}</div>
                </div>
                <div class="bg-emerald-50 rounded-xl p-1.5">
                  <div class="text-[10px] font-extrabold text-emerald-600 uppercase">Đúng</div>
                  <div class="text-lg font-black text-emerald-700">${r.status === "question_reveal" ? (r.revealedAnswer?.stats?.correct ?? 0) : "—"}</div>
                </div>
                <div class="bg-rose-50 rounded-xl p-1.5">
                  <div class="text-[10px] font-extrabold text-rose-600 uppercase">Sai/Chưa</div>
                  <div class="text-lg font-black text-rose-700">${
                    r.status === "question_reveal"
                      ? (r.revealedAnswer?.stats?.wrong ?? 0) + (r.revealedAnswer?.stats?.unanswered ?? 0)
                      : Math.max(0, state.roomPlayers.length - currentQAnswers.length)
                  }</div>
                </div>
              </div>

              <div class="flex-1 bg-amber-50/95 rounded-3xl p-4 shadow-lg border-4 border-amber-300 flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <h3 class="font-black text-amber-950 text-sm sm:text-base"><i class="fa-solid fa-trophy text-amber-500 mr-1.5"></i>Học sinh xuất sắc nhất</h3>
                    <span class="text-[11px] font-extrabold text-amber-700 bg-amber-200/70 px-2 py-0.5 rounded-full">TOP 3</span>
                  </div>
                  <div class="space-y-2">${top3Html}</div>
                </div>
                ${fastestHtml}
              </div>
            </div>
          </div>

          <!-- Controls Bar -->
          <div class="bg-white/95 border-y-2 border-amber-200 px-4 py-2.5 shadow-sm">
            <div class="max-w-[1440px] mx-auto flex flex-wrap items-center justify-center sm:justify-between gap-2">
              <div class="flex flex-wrap items-center gap-2">${leftControlsHtml}</div>
              <button id="btn-end-early" type="button" class="px-4 py-2 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-700 font-extrabold text-sm">
                <i class="fa-solid fa-stop-circle mr-1.5"></i> Kết thúc trận đấu
              </button>
            </div>
          </div>

          <!-- Animated Classroom Desks -->
          <div class="flex-1 p-4 sm:p-5 overflow-y-auto ${theme.floorClass}">
            <div class="max-w-[1440px] mx-auto">
              ${
                state.roomPlayers.length === 0
                  ? `<div class="bg-white/85 rounded-2xl p-6 text-center text-slate-600 font-bold max-w-md mx-auto">Chưa có học sinh trong lớp.</div>`
                  : `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 gap-3 sm:gap-4">${desksGridHtml}</div>`
              }
            </div>
          </div>
        </main>`;

      const btnPR = document.getElementById("btn-pause-resume");
      if (btnPR) btnPR.onclick = handlePauseResume;
      const btnRev = document.getElementById("btn-reveal-ans");
      if (btnRev) btnRev.onclick = handleRevealAnswer;
      const btnNext = document.getElementById("btn-next-q");
      if (btnNext) btnNext.onclick = () => launchQuestion(r.currentQuestionIndex + 1);
      const btnFin = document.getElementById("btn-finish-match");
      if (btnFin) btnFin.onclick = handleEndMatch;
      document.getElementById("btn-end-early").onclick = () => {
        showConfirm("Kết thúc trận đấu sớm?", "Hệ thống sẽ tổng kết điểm hiện tại và mở màn hình lễ trao giải.", handleEndMatch);
      };

      root.querySelectorAll("[data-inspect-uid]").forEach((el) => {
        el.onclick = () => {
          const p = state.roomPlayers.find((x) => x.uid === el.getAttribute("data-inspect-uid"));
          if (p) showInspectStudentModal(p);
        };
      });
    }

    // --- VIEW 5: TEACHER SUMMARY & AWARD CEREMONY ---
    function renderTeacherSummaryView(root) {
      const r = state.roomData;
      const theme = THEMES[state.themeId] || THEMES.classroom;
      if (!r) return;

      const p1 = state.roomPlayers[0];
      const p2 = state.roomPlayers[1];
      const p3 = state.roomPlayers[2];

      const podiumHtml = state.roomPlayers.length > 0
        ? `<div class="mt-8 flex items-end justify-center gap-3 sm:gap-6 max-w-2xl mx-auto">
             ${
               p2
                 ? `<div class="flex-1 flex flex-col items-center">
                      ${renderStudentAvatarSVG(p2.avatarId, "correct")}
                      <div class="font-black text-slate-800 text-sm sm:text-base mt-1 truncate max-w-full">${escapeHtml(p2.name)}</div>
                      <div class="text-xs font-bold text-slate-500 mb-2">${p2.score || 0} điểm</div>
                      <div class="w-full h-24 sm:h-28 rounded-t-2xl bg-gradient-to-b from-slate-300 to-slate-400 border-t-4 border-slate-200 flex flex-col items-center justify-center text-white shadow-lg">
                        <span class="text-3xl">🥈</span><span class="font-black text-xs sm:text-sm uppercase">Á Quân</span>
                      </div>
                    </div>`
                 : ""
             }
             ${
               p1
                 ? `<div class="flex-1 flex flex-col items-center">
                      <i class="fa-solid fa-crown text-3xl text-amber-500 animate-bounce mb-1"></i>
                      ${renderStudentAvatarSVG(p1.avatarId, "correct")}
                      <div class="font-black text-amber-950 text-base sm:text-lg mt-1 truncate max-w-full">${escapeHtml(p1.name)}</div>
                      <div class="text-sm font-black text-amber-600 mb-2">${p1.score || 0} điểm</div>
                      <div class="w-full h-32 sm:h-40 rounded-t-2xl bg-gradient-to-b from-amber-400 to-yellow-500 border-t-4 border-yellow-200 flex flex-col items-center justify-center text-amber-950 shadow-xl">
                        <span class="text-4xl">🥇</span><span class="font-black text-sm sm:text-base uppercase">Quán Quân</span>
                      </div>
                    </div>`
                 : ""
             }
             ${
               p3

    // --- VIEW 6: STUDENT JOIN SCREEN ---

    // --- VIEW 7: STUDENT LIVE GAME SCREEN ---
    function updateStudentHeaderOnly() {
      const myPlayer = state.roomPlayers.find((p) => p.uid === state.user?.uid);
      const scoreEl = document.getElementById("student-score-val");
      if (scoreEl && myPlayer) scoreEl.textContent = myPlayer.score || 0;
    }

    function renderStudentGameView(root) {
      const r = state.roomData;
      const theme = THEMES[state.themeId] || THEMES.classroom;

      if (!r) {
        root.innerHTML = `
          <main class="flex-1 flex items-center justify-center p-6 ${theme.wallBg}">
            <div class="bg-white rounded-3xl p-8 text-center shadow-xl border-4 border-amber-200 max-w-md w-full">
              <p class="font-extrabold text-slate-700">Đang đồng bộ dữ liệu phòng chơi #${escapeHtml(state.currentPin)}...</p>
            </div>
          </main>`;
        return;
      }

      const myPlayer = state.roomPlayers.find((p) => p.uid === state.user?.uid);
      const myRank = Math.max(1, state.roomPlayers.findIndex((p) => p.uid === state.user?.uid) + 1);
      const myAns = r.currentQuestionIndex >= 0
        ? state.roomAnswers.find((a) => a.uid === state.user?.uid && a.qIndex === r.currentQuestionIndex)
        : null;

      // Reset multi-select / scramble picks when question changes
      const qKey = `${r.status}_${r.currentQuestionIndex}_${myAns ? "ans" : "noans"}`;
      if (state.lastRenderedStudentQKey !== qKey) {
        state.studentMultiPicks = [];
        state.studentScramblePickedIdx = [];
      }
      // Keep focus in short_answer text box while typing
      if (
        r.status === "question_active" &&
        r.currentQuestionPublic?.type === "short_answer" &&
        !myAns &&
        state.lastRenderedStudentQKey === qKey &&
        document.getElementById("inp-short-ans")
      ) {
        updateStudentHeaderOnly();
        return;
      }
      state.lastRenderedStudentQKey = qKey;

      let stageHtml = "";

      if (r.status === "lobby") {
        stageHtml = `
          <div class="flex-1 flex flex-col items-center justify-center bg-white/95 rounded-3xl p-8 text-center shadow-xl border-4 border-sky-200">
            <div class="mb-4">${renderStudentAvatarSVG(myPlayer?.avatarId || state.studentAvatar, "idle")}</div>
            <h2 class="text-2xl sm:text-3xl font-black text-sky-900">Em đã vào lớp thành công! 🎉</h2>
            <p class="text-slate-600 font-semibold mt-2 max-w-md">
              Hãy nhìn lên màn hình của thầy/cô nhé. Trò chơi sẽ bắt đầu ngay khi thầy/cô bấm nút Bắt đầu!
            </p>
            <div class="mt-6 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-amber-100 text-amber-900 font-extrabold text-sm animate-pulse">
              <i class="fa-regular fa-clock"></i> Đang chờ giáo viên bắt đầu... (${state.roomPlayers.length} bạn trong lớp)
            </div>
          </div>`;
      } else if ((r.status === "question_active" || r.status === "paused") && r.currentQuestionPublic) {
        const qPub = r.currentQuestionPublic;
        const pct = Math.min(100, (state.remainingSec / (qPub.timeLimit || 20)) * 100);
        const mediaHtml = qPub.image
          ? qPub.image.startsWith("http")
            ? `<img src="${escapeHtml(qPub.image)}" onerror="this.style.display='none'" alt="Minh họa" class="max-h-36 rounded-2xl shadow mx-auto" />`
            : `<div class="text-5xl">${escapeHtml(qPub.image)}</div>`
          : "";

        let interactionHtml = "";
        if (myAns) {
          interactionHtml = `
            <div class="flex-1 bg-sky-50 rounded-3xl p-8 border-4 border-sky-300 text-center flex flex-col items-center justify-center shadow-inner animate-pop">
              <div class="w-16 h-16 rounded-full bg-sky-500 text-white flex items-center justify-center text-3xl mb-3 shadow-lg animate-bounce"><i class="fa-solid fa-check"></i></div>
              <h4 class="text-2xl font-black text-sky-900">Đã gửi câu trả lời!</h4>
              <p class="text-sky-700 font-bold mt-2">
                Đáp án em chọn: <span class="bg-white px-3 py-1 rounded-xl border border-sky-200">${escapeHtml(formatDisplayAnswer(qPub.type, myAns.answer))}</span>
              </p>
              <p class="text-slate-500 text-sm font-semibold mt-3">Hãy chờ thầy/cô công bố đáp án đúng nhé!</p>
            </div>`;
        } else if (r.status === "paused") {
          interactionHtml = `
            <div class="flex-1 bg-amber-50 rounded-3xl p-8 border-4 border-amber-300 text-center flex flex-col items-center justify-center">
              <i class="fa-solid fa-pause text-4xl text-amber-600 mb-2"></i>
              <h4 class="text-xl font-black text-amber-900">Giáo viên đang tạm dừng</h4>
            </div>`;
        } else if (qPub.type === "short_answer") {
          interactionHtml = `
            <div class="bg-white/95 rounded-3xl p-5 sm:p-6 shadow-lg border-2 border-sky-200 space-y-4">
              <input id="inp-short-ans" type="text" placeholder="Nhập câu trả lời của em tại đây..." class="w-full text-center text-2xl font-black py-4 px-4 rounded-2xl border-2 border-sky-300 focus:border-sky-500 focus:outline-none bg-sky-50/40" autocomplete="off" />
              <button id="btn-submit-short" type="button" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black text-xl shadow-lg border-b-4 border-teal-800 active:border-b-0 active:translate-y-1">
                <i class="fa-solid fa-paper-plane mr-2"></i> GỬI ĐÁP ÁN
              </button>
            </div>`;
        } else if (qPub.type === "scramble") {
          const tiles = qPub.scrambledLetters || [];
          const builtWord = state.studentScramblePickedIdx.map((i) => tiles[i]).join("");
          interactionHtml = `
            <div class="bg-white/95 rounded-3xl p-5 sm:p-6 shadow-lg border-2 border-amber-300 space-y-4 text-center">
              <div class="text-xs font-extrabold text-amber-700 uppercase">Bấm vào từng chữ cái để ghép thành từ đúng:</div>
              <div class="min-h-[60px] flex flex-wrap items-center justify-center gap-2 p-3 rounded-2xl bg-amber-50 border-2 border-dashed border-amber-300">

                  state.studentScramblePickedIdx.length === 0
                    ? `<span class="text-slate-400 font-bold text-sm">Chữ em ghép sẽ hiện tại đây...</span>`

                          (tileIdx, pos) => `
                          <button type="button" data-unpick-pos="${pos}" class="w-12 h-12 rounded-2xl bg-emerald-500 text-white font-black text-2xl shadow-md border-b-4 border-emerald-700 hover:bg-rose-500 transition-colors">
                            ${escapeHtml(tiles[tileIdx])}
                          </button>`

                        .join("")

              </div>
              <div class="flex flex-wrap items-center justify-center gap-2.5 pt-1">
                ${tiles
                  .map((ch, idx) => {
                    const used = state.studentScramblePickedIdx.includes(idx);
                    return `
                      <button type="button" data-pick-tile="${idx}" ${used ? "disabled" : ""} class="w-14 h-14 rounded-2xl font-black text-2xl shadow-md border-b-4 transition-all ${
                        used
                          ? "bg-slate-200 text-slate-400 border-slate-300 scale-90"
                          : "bg-amber-400 hover:bg-amber-300 text-amber-950 border-amber-600 active:translate-y-1"
                      }">${escapeHtml(ch)}</button>`;
                  })
                  .join("")}
              </div>
              <div class="flex gap-2 pt-2">
                <button type="button" id="btn-scramble-clear" class="px-5 py-3.5 rounded-2xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-black text-base">

                </button>
              </div>
            </div>`;
        } else if (qPub.type === "image_choice") {
          const cardColors = [
            "border-rose-400 bg-rose-50 hover:bg-rose-100",
            "border-sky-400 bg-sky-50 hover:bg-sky-100",
            "border-amber-400 bg-amber-50 hover:bg-amber-100",
            "border-emerald-400 bg-emerald-50 hover:bg-emerald-100",
          ];
          interactionHtml = `
            <div class="grid grid-cols-2 gap-3 sm:gap-4 flex-1">
              ${(qPub.options || [])
                .map((opt, idx) => {
                  const { media, label } = parseImageChoiceOption(opt);
                  const mediaEl = media.startsWith("http")
                    ? `<img src="${escapeHtml(media)}" onerror="this.src='https://placehold.co/96x96/e2e8f0/475569?text=IMG'" alt="${escapeHtml(label)}" class="h-24 w-24 object-cover rounded-2xl shadow" />`
                    : `<div class="text-6xl">${escapeHtml(media)}</div>`;
                  return `
                    <button type="button" data-pick-opt="${idx}" class="p-4 rounded-3xl border-4 shadow-lg active:scale-95 transition-all flex flex-col items-center justify-center gap-2 ${cardColors[idx % 4]}">
                      ${mediaEl}
                      ${label ? `<span class="font-black text-slate-900 text-base sm:text-lg">${escapeHtml(label)}</span>` : ""}
                    </button>`;
                })
                .join("")}
            </div>`;
        } else if (qPub.type === "multi_select") {
          interactionHtml = `
            <div class="flex-1 flex flex-col gap-3">
              <div class="text-center text-xs sm:text-sm font-black text-indigo-800 bg-indigo-100 py-1.5 px-3 rounded-xl">
                ☑️ Em hãy chọn TẤT CẢ các đáp án đúng rồi bấm nút GỬI ở bên dưới nhé!
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 flex-1">
                ${(qPub.options || [])
                  .map((opt, idx) => {
                    const checked = state.studentMultiPicks.includes(opt);
                    return `
                      <button type="button" data-toggle-multi="${idx}" class="min-h-[76px] p-4 rounded-3xl font-black text-lg shadow-md border-4 transition-all flex items-center gap-3 text-left ${
                        checked
                          ? "bg-indigo-600 text-white border-indigo-900 scale-[1.02]"
                          : "bg-white text-slate-800 border-slate-300 hover:border-indigo-400"
                      }">
                        <span class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 border-2 ${
                          checked ? "bg-white text-indigo-700 border-white" : "bg-slate-100 text-slate-400 border-slate-300"
                        }"><i class="fa-solid ${checked ? "fa-check" : "fa-square"}"></i></span>
                        <span class="leading-tight">${escapeHtml(opt)}</span>
                      </button>`;
                  })
                  .join("")}
              </div>
              <button type="button" id="btn-submit-multi" ${state.studentMultiPicks.length === 0 ? "disabled" : ""} class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 disabled:opacity-40 text-white font-black text-xl shadow-lg border-b-4 border-teal-800">
                <i class="fa-solid fa-paper-plane mr-2"></i> GỬI ${state.studentMultiPicks.length} ĐÁP ÁN ĐÃ CHỌN
              </button>

          const colors = [
            "bg-rose-500 hover:bg-rose-400 border-rose-700",
            "bg-sky-500 hover:bg-sky-400 border-sky-700",
            "bg-amber-500 hover:bg-amber-400 border-amber-700",
            "bg-emerald-500 hover:bg-emerald-400 border-emerald-700",
          ];
          interactionHtml = `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 flex-1">
              ${(qPub.options || [])
                .map(
                  (opt, idx) => `
                  <button type="button" data-pick-opt="${idx}" class="min-h-[84px] p-4 rounded-3xl text-white font-black text-lg sm:text-xl shadow-lg border-b-[6px] active:border-b-0 active:translate-y-1.5 transition-all flex items-center gap-3 text-left ${colors[idx % 4]}">
