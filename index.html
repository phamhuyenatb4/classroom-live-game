                  </button>`
                )
                .join("")}
            </div>`;
        }

        stageHtml = `
          <div class="flex-1 flex flex-col gap-4">
            <div class="bg-white/95 rounded-2xl p-3 shadow border border-amber-200">
              <div class="flex items-center justify-between text-sm font-black mb-1.5">
                <span class="text-amber-900">Câu ${r.currentQuestionIndex + 1} / ${r.totalQuestions}</span>
                <span id="student-timer-text" class="${state.remainingSec <= 5 ? "text-rose-600 animate-pulse" : "text-sky-700"}">
                  ${r.status === "paused" ? "⏸️ Tạm dừng" : `⏱️ Còn ${state.remainingSec} giây`}
                </span>
              </div>
              <div class="w-full h-3 bg-slate-200 rounded-full overflow-hidden">
                <div id="student-timer-bar" class="h-full transition-all duration-300 ${state.remainingSec <= 5 ? "bg-rose-500" : "bg-emerald-500"}" style="width:${pct}%"></div>
              </div>
            </div>

            <div class="bg-white/95 rounded-3xl p-5 sm:p-6 shadow-lg border-4 border-amber-200 text-center space-y-3">
              ${mediaHtml}
              <h3 class="text-xl sm:text-2xl font-black text-slate-900 leading-snug">${escapeHtml(qPub.text)}</h3>
            </div>

            ${interactionHtml}
          </div>`;
      } else if (r.status === "question_reveal") {
        const res = myPlayer?.lastResult || "timeout";
        const boxCls =
          res === "correct" ? "bg-emerald-50 border-emerald-400"
          : res === "wrong" ? "bg-rose-50 border-rose-400"
          : "bg-slate-50 border-slate-300";

        const feedbackHtml =
          res === "correct"
            ? `<h3 class="text-3xl font-black text-emerald-700">CHÍNH XÁC! 🎉</h3>
               <div class="px-5 py-2 rounded-2xl bg-emerald-500 text-white font-black text-xl shadow">+${myPlayer?.lastPointsEarned || 0} điểm</div>`
            : res === "wrong"
            ? `<h3 class="text-3xl font-black text-rose-600">Tiếc quá, chưa đúng rồi!</h3>
               <p class="text-slate-600 font-bold">Cố gắng lên ở câu tiếp theo em nhé 💪</p>`
            : `<h3 class="text-3xl font-black text-slate-700">Hết giờ mất rồi! ⏰</h3>
               <p class="text-slate-500 font-bold">Câu sau em hãy trả lời nhanh hơn nhé!</p>`;

        stageHtml = `
          <div class="flex-1 rounded-3xl p-6 sm:p-8 text-center shadow-xl border-4 flex flex-col items-center justify-center space-y-4 animate-pop ${boxCls}">
            ${renderStudentAvatarSVG(myPlayer?.avatarId || state.studentAvatar, res)}
            ${feedbackHtml}
            <div class="bg-white px-5 py-3 rounded-2xl border border-slate-200 shadow-sm">
              <span class="text-xs font-extrabold text-slate-500 uppercase block">Đáp án đúng là</span>
              <span class="text-xl font-black text-emerald-700">${escapeHtml(formatDisplayAnswer(r.currentQuestionPublic?.type, r.revealedAnswer?.correctAnswer))}</span>
            </div>
            <p class="text-sm font-bold text-slate-500 pt-2">
              Thứ hạng hiện tại của em: <span class="text-amber-700 font-black text-base">Hạng #${myRank} / ${state.roomPlayers.length}</span>
            </p>
          </div>`;
      } else if (r.status === "finished") {
        stageHtml = `
          <div class="flex-1 bg-white/95 rounded-3xl p-6 sm:p-8 text-center shadow-xl border-4 border-amber-300 flex flex-col items-center justify-center space-y-4 animate-pop">
            <div class="text-5xl animate-bounce">🏆</div>
            <h2 class="text-3xl font-black text-amber-950">Hoàn Thành Trận Đấu!</h2>
            ${renderStudentAvatarSVG(myPlayer?.avatarId || state.studentAvatar, "correct")}
            <div class="grid grid-cols-2 gap-3 w-full max-w-sm">
              <div class="bg-amber-50 p-3 rounded-2xl border border-amber-200">
                <div class="text-xs font-extrabold text-amber-700">TỔNG ĐIỂM</div>
                <div class="text-2xl font-black text-amber-950">${myPlayer?.score || 0}</div>
              </div>
              <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-200">
                <div class="text-xs font-extrabold text-emerald-700">THỨ HẠNG</div>
                <div class="text-2xl font-black text-emerald-800">#${myRank}</div>
              </div>
            </div>
            <p class="text-sm font-bold text-slate-600">Em trả lời đúng <b>${myPlayer?.correctCount || 0}</b> / ${r.totalQuestions} câu hỏi!</p>
            <button id="btn-student-home" type="button" class="px-6 py-3 rounded-2xl bg-sky-600 hover:bg-sky-500 text-white font-black shadow">Về trang chủ</button>
          </div>`;
      }

      root.innerHTML = `
        <main class="flex-1 flex flex-col p-3 sm:p-6 ${theme.wallBg}">
          <div class="max-w-3xl w-full mx-auto flex-1 flex flex-col gap-4">
            <div class="bg-white/95 rounded-2xl p-3 sm:p-4 shadow-md border-2 border-amber-200 flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                ${renderStudentAvatarSVG(myPlayer?.avatarId || state.studentAvatar, "idle", "sm")}
                <div>
                  <div class="font-black text-slate-900 text-base sm:text-lg leading-tight">${escapeHtml(myPlayer?.name || state.studentName)}</div>
                  <div class="text-xs font-bold text-slate-500">Lớp ${escapeHtml(myPlayer?.className || state.studentClass)} • Phòng #${escapeHtml(state.currentPin)}</div>
                </div>
              </div>
              <div class="text-right">
                <div class="text-xs font-extrabold text-amber-700 uppercase">Điểm của em</div>
                <div id="student-score-val" class="text-2xl font-black text-amber-600">${myPlayer?.score || 0}</div>
              </div>
            </div>
            ${stageHtml}
          </div>
        </main>`;

      // Bindings for student answer inputs
      const btnShort = document.getElementById("btn-submit-short");
      const inpShort = document.getElementById("inp-short-ans");
      if (btnShort && inpShort) {
        btnShort.onclick = () => handleStudentSubmitAnswer(inpShort.value);
        inpShort.onkeydown = (e) => {
          if (e.key === "Enter") handleStudentSubmitAnswer(inpShort.value);
        };
      }

      root.querySelectorAll("[data-pick-opt]").forEach((btn) => {
        btn.onclick = () => {
          const idx = Number(btn.getAttribute("data-pick-opt"));
          const opt = r.currentQuestionPublic?.options?.[idx];
          if (opt !== undefined) handleStudentSubmitAnswer(opt);
        };
      });

      root.querySelectorAll("[data-toggle-multi]").forEach((btn) => {
        btn.onclick = () => {
          sfx.click();
          const idx = Number(btn.getAttribute("data-toggle-multi"));
          const opt = r.currentQuestionPublic?.options?.[idx];
          if (opt === undefined) return;
          if (state.studentMultiPicks.includes(opt)) {
            state.studentMultiPicks = state.studentMultiPicks.filter((x) => x !== opt);
          } else {
            state.studentMultiPicks = [...state.studentMultiPicks, opt];
          }
          renderStudentGameView(root);
        };
      });
      const btnSubmitMulti = document.getElementById("btn-submit-multi");
      if (btnSubmitMulti) {
        btnSubmitMulti.onclick = () => {
          if (state.studentMultiPicks.length > 0) {
            handleStudentSubmitAnswer(state.studentMultiPicks.join("||"));
          }
        };
      }

      root.querySelectorAll("[data-pick-tile]").forEach((btn) => {
        btn.onclick = () => {
          sfx.click();
          const idx = Number(btn.getAttribute("data-pick-tile"));
          if (!state.studentScramblePickedIdx.includes(idx)) {
            state.studentScramblePickedIdx = [...state.studentScramblePickedIdx, idx];
            renderStudentGameView(root);
          }
        };
      });
      root.querySelectorAll("[data-unpick-pos]").forEach((btn) => {
        btn.onclick = () => {
          sfx.click();
          const pos = Number(btn.getAttribute("data-unpick-pos"));
          state.studentScramblePickedIdx = state.studentScramblePickedIdx.filter((_, i) => i !== pos);
          renderStudentGameView(root);
        };
      });
      const btnScrambleClear = document.getElementById("btn-scramble-clear");
      if (btnScrambleClear) {
        btnScrambleClear.onclick = () => {
          sfx.click();
          state.studentScramblePickedIdx = [];
          renderStudentGameView(root);
        };
      }
      const btnSubmitScramble = document.getElementById("btn-submit-scramble");
      if (btnSubmitScramble) {
        btnSubmitScramble.onclick = () => {
          const tiles = r.currentQuestionPublic?.scrambledLetters || [];
          const word = state.studentScramblePickedIdx.map((i) => tiles[i]).join("");
          if (word) handleStudentSubmitAnswer(word);
        };
      }

      const btnHome = document.getElementById("btn-student-home");
      if (btnHome) {
        btnHome.onclick = () => {
          unsubscribeRoomListeners();
          state.currentPin = "";
          state.roomData = null;
          state.view = "home";
          renderCurrentView();
        };
      }
    }

    // ========================================================================
    // 12. GLOBAL HEADER EVENTS & BOOTSTRAP
    // ========================================================================
    document.getElementById("btn-logo-home").onclick = () => {
      sfx.click();
      if (state.view === "teacher_game" || state.view === "student_game") {
        showConfirm("Rời khỏi phòng chơi?", "Bạn có muốn quay về trang chủ không?", () => {
          unsubscribeRoomListeners();
          state.currentPin = "";
          state.roomData = null;
          state.view = "home";
          renderCurrentView();
        });
      } else {
        state.view = "home";
        renderCurrentView();
      }
    };

    document.getElementById("btn-toggle-sound").onclick = () => {
      sfx.muted = !sfx.muted;
      const icon = document.getElementById("icon-sound");
      icon.className = sfx.muted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
    };

    document.querySelectorAll(".theme-btn").forEach((btn) => {
      btn.onclick = async () => {
        sfx.click();
        state.themeId = btn.getAttribute("data-theme");
        updateThemeSwitcherUI();
        if (db && state.currentPin && state.roomData && state.roomData.hostUid === state.user?.uid) {
          await updateDoc(publicDoc("rooms", state.currentPin), { theme: state.themeId });
        }
        renderCurrentView();
      };
    });

    // Auto-fill PIN from URL (?pin=XXXXXX) for QR code scanning
    try {
      const params = new URLSearchParams(window.location.search);
      const pinParam = params.get("pin");
      if (pinParam && /^\d{6}$/.test(pinParam)) {
        state.joinPin = pinParam;
        state.view = "student_join";
      }
    } catch {}

    // RULE 3: Authenticate FIRST before any Firestore listeners
    async function bootstrapApp() {
      if (!hasFirebaseConfig || !auth || !db) {
        // Fallback so UI still renders cleanly if opened directly without Firebase config
        state.questionSets = JSON.parse(JSON.stringify(DEFAULT_QUESTION_SETS));
        state.authReady = true;
        renderCurrentView();
        return;
      }

      // Safety fallback timeout so screen never hangs blank
      const safetyTimer = setTimeout(() => {
        if (!state.authReady) {
          state.authReady = true;
          renderCurrentView();
        }
      }, 3500);

      try {
        if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error("Auth init error:", err);
      }

      onAuthStateChanged(auth, (u) => {
        clearTimeout(safetyTimer);
        state.user = u;
        state.authReady = true;
        if (u) {
          // Sync custom teacher password from Firestore
          onSnapshot(
            publicDoc("settings", "teacher_security"),
            (snap) => {
              if (snap.exists() && snap.data().password) {
                state.teacherPassword = snap.data().password;
              }
            },
            (err) => console.error("Security settings snapshot error:", err)
          );

          // Subscribe to Question Sets & Match History
          onSnapshot(
            publicCol("question_sets"),
            (snap) => {
              const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
              list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
              state.questionSets = list;
              if (state.view === "teacher_dashboard" && !state.editingSet) renderCurrentView();
            },
            (err) => console.error("Question sets error:", err)
          );

          onSnapshot(
            publicCol("match_history"),
            (snap) => {
              const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
              list.sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
              state.matchHistory = list;
              if (state.view === "teacher_dashboard" && state.teacherTab === "history") renderCurrentView();
            },
            (err) => console.error("Match history error:", err)
          );
        }
        renderCurrentView();
      });
    }

    bootstrapApp();
  </script>
</body>
</html>
